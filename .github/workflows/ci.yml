name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    # build ต้องอ่าน DB (generateStaticParams ของหน้าแบรนด์) จึงใช้ Postgres ชั่วคราวพร้อม seed ไม่แตะ Supabase
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      # warning ก็ไม่ผ่าน
      - run: npm run lint -- --max-warnings=0
      - run: npm run typecheck
      # unit test + coverage gate (เกณฑ์อยู่ใน vitest.config.mts)
      - run: npm run test:coverage
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const t = require("./coverage/coverage-summary.json").total;
              const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
              console.log(["### Coverage", "| | % | covered |", "|---|---|---|", ...["functions","lines","statements","branches"].map(row)].join("\n"));
            ' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      # publish โปรตัวอย่างใน DB ทดสอบ ให้ e2e ตรวจการ์ดจริง (ต้องก่อน build เพราะหน้าเป็น static)
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/e2e-fixture.sql
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
